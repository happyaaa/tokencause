name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: tokencause --version
      - run: tokencause doctor --json | python -m json.tool
      - run: tokencause analyze examples/tokencause_trace.jsonl --budget 2 --json | python -m json.tool
      - run: tokencause dashboard --demo --out /tmp/tokencause-dashboard-demo.html
      - run: tokencause demo-site --out /tmp/tokencause-demo-site
      - run: python -m unittest discover -s tests

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test]
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
