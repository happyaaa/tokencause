<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="34" y="42" width="1132" height="548" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#020617" flood-opacity="0.16"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#E5E7EB" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#F7F7F4"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.42"/>

  <g filter="url(#shadow)">
    <rect x="70" y="70" width="1060" height="490" rx="18" fill="#FBFBF8" stroke="#111827" stroke-width="2"/>

    <g transform="translate(112 112)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#475569">$ uvx tokencause report --last --open</text>
      <text x="0" y="86" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="74" font-weight="900" letter-spacing="-4" fill="#0B0F19">TokenCause</text>
      <text x="2" y="132" font-family="Inter, Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#1F2937">AI coding session postmortems.</text>
      <text x="2" y="170" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" fill="#475569">Diagnose why agent runs burn tokens and context.</text>
    </g>

    <g transform="translate(112 370)">
      <rect x="0" y="0" width="410" height="112" rx="14" fill="#0B0F19"/>
      <text x="24" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#93C5FD">likely cause</text>
      <text x="24" y="70" font-family="Inter, Arial, Helvetica, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">Search-heavy discovery</text>
      <text x="24" y="96" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" fill="#CBD5E1">Restart from a checkpoint summary.</text>
    </g>

    <g transform="translate(668 114)">
      <rect x="0" y="0" width="360" height="368" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="28" y="46" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#111827">Session trace</text>
      <text x="28" y="75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#64748B">visible tokens → signals</text>

      <line x1="48" y1="118" x2="48" y2="304" stroke="#CBD5E1" stroke-width="2"/>

      <g transform="translate(28 108)">
        <circle cx="20" cy="20" r="10" fill="#2563EB"/>
        <text x="52" y="16" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#111827">Broad search</text>
        <text x="52" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#2563EB">14 searches · 820 refs</text>
      </g>

      <g transform="translate(28 180)">
        <circle cx="20" cy="20" r="10" fill="#F97316"/>
        <text x="52" y="16" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#111827">Long tool output</text>
        <text x="52" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#EA580C">10.1K tokens payload</text>
      </g>

      <g transform="translate(28 252)">
        <circle cx="20" cy="20" r="10" fill="#64748B"/>
        <text x="52" y="16" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" font-weight="800" fill="#111827">Context drift</text>
        <text x="52" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#475569">later turns grew 2.24x</text>
