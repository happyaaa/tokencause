      <rect x="28" y="324" width="304" height="1" fill="#E5E7EB"/>
      <text x="28" y="350" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#111827">Not a token bill. A workflow diagnosis.</text>
